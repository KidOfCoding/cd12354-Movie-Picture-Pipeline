name: Backend Continuous Integration

on:
  pull_request:
    paths:
      - 'starter/backend/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Pipenv & Run Lint
        run: |
          cd starter/backend
          pip install pipenv
          pipenv install --dev
          pipenv run lint || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Pipenv & Run Tests
        run: |
          cd starter/backend
          pip install pipenv
          pipenv install --dev
          pipenv run test || true

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: |
          cd starter/backend
          docker build --tag mp-backend:latest .
